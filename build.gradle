
plugins {
    id 'java'
    id 'application'
    id 'org.gretty' version '4.1.5'
    id 'pmd'
}

repositories {
    mavenCentral()
}

def jakartaVersion = '6.1.0'
def apacheCommonsVersion = '3.17.0'

dependencies {

    implementation group: 'org.glassfish.jersey.core',
            name: 'jersey-client',
            version: '3.1.7'

    implementation group: 'org.glassfish.jersey.media',
            name: 'jersey-media-json-jackson',
            version: '3.1.4'

    implementation group: 'org.glassfish.jersey.inject',
            name: 'jersey-hk2',
            version: '3.1.7'

    implementation group: 'com.fasterxml.jackson.datatype',
            name: 'jackson-datatype-jsr310',
            version: '2.17.2'

    compileOnly group: 'jakarta.servlet',
            name: 'jakarta.servlet-api',
            version: jakartaVersion

    implementation group: 'jakarta.activation',
            name: 'jakarta.activation-api',
            version: '2.1.3'

    implementation group: 'org.apache.commons',
            name: 'commons-lang3',
            version: apacheCommonsVersion

    implementation group: 'org.apache.commons',
            name: 'commons-csv',
            version: '1.10.0'

    testImplementation group: 'junit',
            name: 'junit',
            version: '4.13.2'

    testImplementation group: 'org.hamcrest',
            name: 'hamcrest-library',
            version: '2.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'java.HelloServlet'
}

gretty {
    contextPath = '/'
}

pmd{
    consoleOutput = true
    toolVersion = "7.5.0"
    ruleSets = ["/"]
}

tasks.register('runTest', JavaExec) {
    mainClass.set('util.Runner')

    classpath = sourceSets.test.runtimeClasspath
}

