
plugins {
    id 'java'
    id 'application'
    id 'org.gretty' version '4.1.5'
    id 'pmd'
}

repositories {
    mavenCentral()
}

def jakartaVersion = '6.1.0'
def apacheCommonsVersion = '3.17.0'
def hsqldbVersion='2.7.3'

def springVersion = '6.1.14'
def springSecurityVersion = '6.3.4'
def jacksonVersion = '2.17.0'
def jsonWebTokenVersion = '0.12.6'

dependencies {

    implementation group: 'org.glassfish.jersey.core',
            name: 'jersey-client',
            version: '3.1.7'

    implementation group: 'org.glassfish.jersey.media',
            name: 'jersey-media-json-jackson',
            version: '3.1.4'

    implementation group: 'org.glassfish.jersey.inject',
            name: 'jersey-hk2',
            version: '3.1.7'

    implementation group: 'com.fasterxml.jackson.datatype',
            name: 'jackson-datatype-jsr310',
            version: '2.17.2'

    compileOnly group: 'jakarta.servlet',
            name: 'jakarta.servlet-api',
            version: jakartaVersion

    implementation group: 'jakarta.activation',
            name: 'jakarta.activation-api',
            version: '2.1.3'

    implementation group: 'org.apache.commons',
            name: 'commons-lang3',
            version: apacheCommonsVersion

    implementation group: 'org.apache.commons',
            name: 'commons-csv',
            version: '1.10.0'

    implementation group: 'org.apache.commons',
            name: 'commons-dbcp2',
            version: '2.12.0'

    implementation group: 'org.springframework',
            name: 'spring-webmvc',
            version: '6.1.13'

    implementation group: 'org.springframework',
            name: 'spring-jdbc',
            version: '6.1.13'

    implementation group: 'org.springframework.security',
            name: 'spring-security-web',
            version: springSecurityVersion

    implementation group: 'org.springframework.security',
            name: 'spring-security-config',
            version: springSecurityVersion

    implementation group: 'org.springframework.security',
            name: 'spring-security-oauth2-client',
            version: springSecurityVersion

    implementation group: 'org.springframework.security',
            name: 'spring-security-oauth2-jose',
            version: springSecurityVersion

    implementation group: 'com.fasterxml.jackson.core',
            name: 'jackson-databind',
            version: jacksonVersion

    implementation group: 'io.jsonwebtoken',
            name: 'jjwt-api',
            version: jsonWebTokenVersion

    implementation group: 'io.jsonwebtoken',
            name: 'jjwt-impl',
            version: jsonWebTokenVersion

    implementation group: 'io.jsonwebtoken',
            name: 'jjwt-jackson',
            version: jsonWebTokenVersion

    testImplementation group: 'org.springframework',
            name: 'spring-test',
            version: springVersion

    testImplementation group: 'org.springframework.security',
            name: 'spring-security-test',
            version: springSecurityVersion

    implementation group: 'org.hsqldb',
            name: 'hsqldb',
            version: hsqldbVersion

    implementation group: 'org.postgresql',
            name: 'postgresql',
            version: '42.7.3'

    implementation group: 'org.hibernate',
            name: 'hibernate-validator',
            version: '8.0.1.Final'

    implementation group: 'org.hibernate',
            name: 'hibernate-core',
            version: '6.6.1.Final'

    implementation group: 'org.springframework',
            name: 'spring-orm',
            version: '6.1.14'

    testImplementation group: 'junit',
            name: 'junit',
            version: '4.13.2'

    testImplementation group: 'org.hamcrest',
            name: 'hamcrest-library',
            version: '2.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'java.HelloServlet'
}

gretty {
    contextPath = '/'
}

pmd{
    consoleOutput = true
    toolVersion = "7.5.0"
    ruleSets = ["/"]
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}

tasks.register('runTest', JavaExec) {
    mainClass.set('util.Runner')

    classpath = sourceSets.test.runtimeClasspath
}

